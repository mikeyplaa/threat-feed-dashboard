<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threat Feed Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Threat Feed Dashboard</h1>
    <div class="controls">
      <a class="nav-link" href="map.html">Attack Sources Today →</a>
      <span id="last-refresh">—</span>
      <button id="refresh-btn">Refresh now</button>
    </div>
  </header>

  <section id="vt-widget">
    <div id="vt-search-bar">
      <span class="vt-label">VirusTotal</span>
      <input id="vt-input" type="text" placeholder="Paste an IP, domain, hash, or URL…" autocomplete="off" spellcheck="false">
      <button id="vt-btn">Look up</button>
    </div>
    <div id="vt-result" hidden></div>
  </section>

  <section id="emailrep-widget">
    <div id="emailrep-search-bar">
      <span class="vt-label">EmailRep</span>
      <input id="emailrep-input" type="text" placeholder="Paste an email address…" autocomplete="off" spellcheck="false">
      <button id="emailrep-btn">Look up</button>
    </div>
    <div id="emailrep-result" hidden></div>
  </section>

  <main id="board">
    <!-- feed columns injected here -->
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
